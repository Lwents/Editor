<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'">
  <title>Lwent Editor</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center; overflow: hidden;
      background: #fff;
      color: #17234b; font-family: "Segoe UI", system-ui, sans-serif;
    }
    main { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 24px; }
    .art { width: min(420px, 58vh, 75vw); height: min(420px, 58vh, 75vw); object-fit: contain; }
    .status { display: flex; align-items: center; gap: 12px; margin-top: 12px; color: #536078; font-size: 14px; }
    .spinner {
      width: 22px; height: 22px; border: 2px solid #e4e9f5;
      border-top-color: #1265ff; border-right-color: #9d3aff; border-radius: 50%;
      animation: spin .9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main aria-label="Đang khởi động Lwent Editor">
    <img class="art" src="assets/loading-logo.png" alt="Logo Lwent Editor">
    <div class="status" role="status"><span class="spinner" aria-hidden="true"></span><span>Đang chuẩn bị trình chỉnh sửa…</span></div>
  </main>
</body>
</html>

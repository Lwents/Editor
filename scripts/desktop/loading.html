<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'">
  <title>Lwent Editor</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center; overflow: hidden;
      background: radial-gradient(ellipse at center, #20253b 0%, #12141b 65%);
      color: #f3f4ff; font-family: "Segoe UI", system-ui, sans-serif;
    }
    main { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 24px; }
    .art { width: min(300px, 40vh); height: min(300px, 40vh); object-fit: contain; }
    h1 { font-size: 24px; letter-spacing: .4px; font-weight: 600; margin: 12px 0 20px; }
    .status { display: flex; align-items: center; gap: 12px; color: #b8bfd7; font-size: 14px; }
    .spinner {
      width: 22px; height: 22px; border: 2px solid #343d59;
      border-top-color: #9ecbff; border-right-color: #a99bff; border-radius: 50%;
      animation: spin .9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main aria-label="Đang khởi động Lwent Editor">
    <img class="art" src="assets/loading-anime.png" alt="Nhân vật anime đang chờ bên máy tính">
    <h1>Lwent Editor</h1>
    <div class="status" role="status"><span class="spinner" aria-hidden="true"></span><span>Đang chuẩn bị trình chỉnh sửa…</span></div>
  </main>
</body>
</html>

<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'"><title>Cấu hình Editor</title><style>body{font:15px system-ui;margin:28px;background:#f7f8fb;color:#15213a}label{display:block;margin:14px 0 5px}input:not([type=checkbox]){box-sizing:border-box;width:100%;padding:10px;border:1px solid #ccd3df;border-radius:7px}button{margin-top:18px;padding:12px;background:#1760df;color:white;border:0;border-radius:8px;cursor:pointer}p{color:#5d687d;font-size:13px}#error{color:#b42318}</style></head><body><h2>Cấu hình AI</h2><p>Dùng máy chủ AI và khóa của bạn để dịch. Bạn vẫn có thể chỉnh video và nhập phụ đề khi chưa cấu hình AI.</p><label>Địa chỉ API tương thích OpenAI</label><input id="url"><label>Model dịch</label><input id="model"><label>Khóa API</label><input id="key" type="password" autocomplete="off" placeholder="Nhập khóa API của bạn"><label>Khóa Freesound (tùy chọn, tìm nhạc / hiệu ứng âm thanh)</label><input id="soundKey" type="password" autocomplete="off" placeholder="Để trống nếu chỉ nhập âm thanh từ máy"><label><input id="cpu" type="checkbox"> Chế độ CPU tương thích (khi GPU không hoạt động)</label><p>Khóa được Windows mã hóa cho tài khoản hiện tại. Model VieNeu và ZeroTTS chạy tại máy; Edge cần Internet.</p><button id="save">Lưu và khởi động lại</button><p id="error"></p><script src="settings.cjs"></script></body></html>

name: Publish Windows app update
on:
  push:
    branches: [main]
    paths:
      - 'fe/**'
      - 'be/app/**'
      - 'be/requirements*.txt'
      - 'scripts/desktop/**'
      - '.github/workflows/desktop-update.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-update
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Windows frontend
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\desktop\prepare-frontend.ps1" -BuildRoot "$env:RUNNER_TEMP\EditorCI"
          & "$env:GITHUB_WORKSPACE\scripts\desktop\stage-frontend.ps1" -BuildRoot "$env:RUNNER_TEMP\EditorCI"
          # Robocopy success codes are 0 through 7; scripts already reject 8+.
          $global:LASTEXITCODE=0
          $Frontend="$env:RUNNER_TEMP\EditorCI\app\resources\bundle\frontend\apps\web"
          $env:PORT='5476'; $env:HOSTNAME='127.0.0.1'
          $Server=Start-Process node.exe -ArgumentList "$Frontend\server.js" -WorkingDirectory $Frontend -RedirectStandardOutput "$env:RUNNER_TEMP\frontend.out.log" -RedirectStandardError "$env:RUNNER_TEMP\frontend.err.log" -PassThru
          try {
            $Ready=$false
            for($i=0;$i -lt 60;$i++){
              try { if((Invoke-WebRequest http://127.0.0.1:5476/projects -TimeoutSec 2).StatusCode -eq 200){$Ready=$true;break} } catch {}
              Start-Sleep -Milliseconds 500
            }
            if(-not $Ready){Get-Content "$env:RUNNER_TEMP\frontend.err.log";throw 'Packaged frontend did not start'}
          } finally { Stop-Process -Id $Server.Id -Force -ErrorAction SilentlyContinue }
      - name: Package update without AI models
        shell: pwsh
        run: |
          $Payload="$env:RUNNER_TEMP\EditorCI\app"
          New-Item -ItemType Directory -Force "$Payload\resources\app","$Payload\resources\bundle\backend\app" | Out-Null
          Copy-Item scripts/desktop/* "$Payload\resources\app" -Recurse -Force
          Copy-Item be/app/* "$Payload\resources\bundle\backend\app" -Recurse -Force
          $Base=(Get-Content scripts/desktop/package.json -Raw | ConvertFrom-Json).version
          $Version="$Base.$env:GITHUB_RUN_NUMBER"
          python scripts/desktop/package-update.py $Payload --output release/update --version $Version
          if($LASTEXITCODE -ne 0){throw 'Update packaging failed'}
          "UPDATE_VERSION=$Version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$env:UPDATE_VERSION" release/update/Editor-Update-Windows-x64.zip release/update/update.json --latest --target $env:GITHUB_SHA --title "Lwent Editor $env:UPDATE_VERSION" --notes "Code update for Lwent Editor 1.3+: frontend, backend and desktop UI. AI models and Python are kept. Commit: $env:GITHUB_SHA"
          if($LASTEXITCODE -ne 0){throw 'Release publishing failed'}
      - name: Build and publish small online installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $Tool="$env:RUNNER_TEMP\innosetup.exe"
          & curl.exe -L --fail --retry 3 -o $Tool https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe
          if($LASTEXITCODE -ne 0){throw 'Installer tool download failed'}
          if((Get-FileHash $Tool -Algorithm SHA256).Hash.ToLower() -ne '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f'){throw 'Installer tool checksum mismatch'}
          $CompilerDir="$env:RUNNER_TEMP\InnoOnline"
          $Install=Start-Process $Tool -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER',"/DIR=$CompilerDir" -Wait -PassThru
          if($Install.ExitCode -ne 0){throw 'Installer tool preparation failed'}
          python scripts/desktop/build-online.py --runtime scripts/desktop/runtime --metadata-only --manifest release/update/update.json --compiler "$CompilerDir\ISCC.exe"
          if($LASTEXITCODE -ne 0){throw 'Online installer build failed'}
          gh release upload "v$env:UPDATE_VERSION" release/online/Lwent-Editor-Online-Setup.exe
          if($LASTEXITCODE -ne 0){throw 'Online installer publishing failed'}

name: Publish Windows app update
on:
  push:
    branches: [main]
    paths:
      - 'fe/**'
      - 'be/app/**'
      - 'be/requirements*.txt'
      - 'scripts/desktop/**'
      - '.github/workflows/desktop-update.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-update
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Windows frontend
        shell: pwsh
        run: |
          & scripts/desktop/prepare-frontend.ps1 -BuildRoot "$env:RUNNER_TEMP\EditorCI"
          & scripts/desktop/stage-frontend.ps1 -BuildRoot "$env:RUNNER_TEMP\EditorCI"
      - name: Package update without AI models
        shell: pwsh
        run: |
          $Payload="$env:RUNNER_TEMP\EditorCI\app"
          New-Item -ItemType Directory -Force "$Payload\resources\app","$Payload\resources\bundle\backend\app" | Out-Null
          Copy-Item scripts/desktop/* "$Payload\resources\app" -Recurse -Force
          Copy-Item be/app/* "$Payload\resources\bundle\backend\app" -Recurse -Force
          $Base=(Get-Content scripts/desktop/package.json -Raw | ConvertFrom-Json).version
          $Version="$Base.$env:GITHUB_RUN_NUMBER"
          python scripts/desktop/package-update.py $Payload --output release/update --version $Version
          if($LASTEXITCODE -ne 0){throw 'Update packaging failed'}
          "UPDATE_VERSION=$Version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$env:UPDATE_VERSION" release/update/Editor-Update-Windows-x64.zip release/update/update.json --target $env:GITHUB_SHA --title "Lwent Editor $env:UPDATE_VERSION" --notes "Code update for Lwent Editor 1.3+: frontend, backend and desktop UI. AI models and Python are kept. Commit: $env:GITHUB_SHA"
          if($LASTEXITCODE -ne 0){throw 'Release publishing failed'}
